[package]
name = "empires"
version = "1.1.0"
description = "Empires — ancient-world real-time strategy"
authors = ["Empires contributors"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[lib]
name = "empires_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.0", features = [] }
